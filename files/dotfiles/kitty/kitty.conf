# TODO: font_family
font_size 11.5
disable_ligatures cursor
# TODO: font_features

cursor_shape beam
cursor_shape_unfocused hollow
cursor_blink_interval -1
cursor_trail 0

scrollback_lines 10000
# TODO: scrollback_pager

detect_urls no
paste_actions quote-urls-at-prompt,confirm,replace-dangerous-control-codes
click_interval -1.0

enable_audio_bell no
window_alert_on_bell no

window_border_width 0
window_padding_width 0
single_window_padding_width -1
inactive_text_alpha 1.0
hide_window_decorations yes

foreground #cdd6f4
background #181825
background_opacity 1.0
background_image none
cursor #f5e0dc
cursor_text_color #11111b
selection_foreground none
selection_background #313241
url_color #89b4fa
wayland_titlebar_color background
active_border_color #b4befe
inactive_border_color #6c7086
bell_border_color #f9e2af
scrollbar_handle_color #9399b2
scrollbar_track_color #45475a
visual_bell_color none
color0 #45475a
color8 #585b70
color1 #f38ba8
color9 #f37799
color2 #a6e3a1
color10 #89d88b
color3 #f9e2af
color11 #ebd391
color4 #89b4fa
color12 #74a8fc
color5 #f5c2e7
color13 #f2aede
color6 #94e2d5
color14 #6bd7ca
color7 #a6adc8
color15 #bac2de
color16 #fab387
color17 #f5e0dc
mark1_foreground #11111b
mark1_background #b4befe
mark2_foreground #11111b
mark2_background #cba6f7
mark3_foreground #11111b
mark3_background #74c7ec

shell /bin/bash
editor .
allow_remote_control no
shell_integration enabled

wayland_enable_ime yes
